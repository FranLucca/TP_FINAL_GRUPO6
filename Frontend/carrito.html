
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolTotal | Carrito</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="encabezado">
        <div class="marca">
            <a href="index.html">
                <img src="img/logo.png" alt="Logo FutbolTotal">
            </a>

            <div>
                <h1>Futbol<span>Total</span></h1>
                <small>Lucas Kosinski | Martino Monsalvo | Franco Lucca</small>
            </div>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#camisetas">Camisetas</a>
            <a href="index.html#botines">Botines</a>
        </nav>

        <a href="carrito.html" class="boton-carrito">
            Carrito (<span id="cantidad-carrito">0</span>)
        </a>
    </header>

    <main>

        <!-- CARRITO DE COMPRAS -->
        <section class="seccion-carrito">
            <h1>Mi carrito</h1>

            <ul id="contenedor-carrito"></ul>

            <!-- TOTAL -->
            <div class="total-carrito">
                <h2>
                    Total: <span id="total-carrito-txt">$0</span>
                </h2>
            </div>

            <!-- BOTONES -->
            <div class="acciones-compra">
                <a href="index.html" class="boton-seguir">
                    Seguir comprando
                </a>

                <button type="button" class="boton-final" onclick="procesarCompraFinal()">
                    Finalizar compra
                </button>
            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>&copy; 2026 FutbolTotal - Todos los derechos reservados.</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/carrito.js"></script>

</body>
</html>
